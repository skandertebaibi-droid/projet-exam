    <main>
        <section>
            <h2 >Enregistrement</h2>
        </section>

        <form action="Inscription-form">
        
            <fieldset>
                <legend>Informations d'inscription</legend>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="@gmail.com" value="">
                </div>
                <div>
                    <label for="mdp">Mot de passe</label>
                    <input type="password" name="mdp" id="mdp" placeholder="mot de passe" value="">
                </div>
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" placeholder="votre nom" value="">
                </div>
                <div>
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" placeholder="votre prénom" value="">
                </div>
                <div>
                    <label for="date">Date de naissance</label>
                    <input type="date" id="date" value="">
                </div>
                <div>
                    <label for="tel">Numéro de téléphone</label>
                    <input type="tel" id="tel" placeholder="votre numéro de téléphone" value="">
                </div>
                <div>
                    <label for="ville">Ville</label>
                    <input type="checkbox" id="ville" placeholder="votre ville" value="">
                    <select name="ville" id="ville">
                        <option value="">Sélectionnez une ville</option>
                        <option value="paris">Paris</option>
                        <option value="lyon">Lyon</option>
                        <option value="marseille">Marseille</option>
                        <option value="toulouse">Toulouse</option>
                        <option value="bordeaux">Bordeaux</option>
                        <option value="lille">Lille</option>
                        <option value="nice">Nice</option>
                    </select>
            </fieldset>
            <fieldset>
                <legend>Information d'inscription</legend>
                <div>
                    <label for="cours">enfants</label>
                    <input type="radio" id="cours" placeholder="votre cours" value="">
                </div>
                <div>
                    <label for="cours">adulte</label>
                    <input type="radio" id="cours" placeholder="votre cours" value="">

                </div>
                <div>
                    <label for="cours">adolescents</label>
                    <input type="radio" id="cours" placeholder="votre cours" value="">
                </div>
            </fieldset>
        </form>
